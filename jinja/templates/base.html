<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Console{% endblock %}</title>

    <!-- Subfolder static path: static/styles/style.css -->
    <link rel="stylesheet" href="{{ url_for('static', path='styles/style.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <!-- Jinja2 Subfolder Component Include -->
    {% include "components/navbar.html" %}

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <!-- Subfolder static path: static/scripts/app.js -->
    <script src="{{ url_for('static', path='scripts/app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
